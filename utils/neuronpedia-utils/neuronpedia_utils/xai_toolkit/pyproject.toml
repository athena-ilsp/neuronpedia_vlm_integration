[project]
name = "neuronpedia-xai-toolkit"
version = "0.1.0"
description = "Convert xai_toolkit SAE/transcoder checkpoints to SAELens folders for Neuronpedia."
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.30.0",
    "pyyaml>=6.0",
    # Same floor as apps/inference, which loads the converted folders.
    "sae-lens>=6.45.3",
    "safetensors>=0.4.0",
    "torch>=2.8.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
